<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JstVegn's User Command List</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #24292f;
      background: #ffffff;
      max-width: 900px;
      margin: 0 auto;
      padding: 32px;
    }

    h1, h2, h3 {
      line-height: 1.25;
      margin-top: 24px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 2em;
    }

    h2 {
      font-size: 1.5em;
    }

    h3 {
      font-size: 1.25em;
    }

    hr {
      height: 1px;
      border: 0;
      background-color: #d0d7de;
      margin: 16px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }

    th,
    td {
      padding: 8px 13px;
      border: 1px solid #d0d7de;
      text-align: left;
      vertical-align: top;
    }

    th {
      font-weight: 600;
      background-color: #f6f8fa;
    }

    tr:nth-child(even) td {
      background-color: #f6f8fa;
    }

    code {
      padding: 0.2em 0.4em;
      margin: 0;
      font-size: 85%;
      background-color: rgba(175, 184, 193, 0.2);
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }

    p {
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <h1>JstVegn's Song Request List</h1>

  <hr>

  <table id="songs">
    <thead>
      <tr>
        <th>Song Number</th>
        <th>Genre</th>
        <th>Artist</th>
        <th>Title</th>
      <tr></thead>
    <tbody></tbody>
  </table>

  <script>
  fetch('allFiles.txt')
    .then(r => r.text())
    .then(text => {
      const tbody = document.querySelector('#songs tbody');
      text.split(/\r?\n/).filter(l => l.trim()).forEach(line => {
          
        lineParts = line.split('|');

        Genre = lineParts[0];
        artist = lineParts[1];
        title = lineParts[2];

        const tr = document.createElement('tr');
        
        const tdGenre = document.createElement('td');
        tdGenre.textContent = lineParts[0];
        tr.appendChild(tdGenre);

        const tdArtist = document.createElement('td');
        tdArtist.textContent = lineParts[0];
        tr.appendChild(tdArtist);t.createElement('td');

        const tdTitle = document.createElement('td');
        tdTitle.textContent = lineParts[0];
        tr.appendChild(tdTitle);t.createElement('td');

        tbody.appendChild(tr);
      });
    })
    .catch(err => console.error('Failed to load song list:', err));
  </script>

  
   </body>
</html>
